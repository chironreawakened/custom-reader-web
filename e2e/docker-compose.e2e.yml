# CI e2e stack (GitHub Actions only — never on the VPS).
# postgres: the real schema via the app's migrations.
# minio:   S3 stand-in for Hippius (the health check does an encrypted
#          round trip against it; the api creates the bucket on boot in CI).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: "readerpass"
      POSTGRES_DB: reader
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: "***"
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
