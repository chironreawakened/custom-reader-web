# CI e2e stack (GitHub Actions only — never on the VPS).
# postgres: the real schema via the app's migrations.
# s3:       adobe/s3mock as the S3 stand-in for Hippius (the health check does
#           an encrypted round trip against it). Mirrors the VPS local-verify
#           stack; MinIO's old Docker Hub tags get pruned (pull 401s), s3mock
#           accepts any credentials and serves any bucket.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: "***"
      POSTGRES_DB: reader
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader"]
      interval: 2s
      timeout: 2s
      retries: 30
  s3:
    image: adobe/s3mock:latest
    command: ["-s3.local-service", "true"]
    environment:
      - INITIAL_BUCKETS=reader-e2e
    ports:
      - "127.0.0.1:9000:9090"
