name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # E2E (Playwright) — CI only, never on the VPS (4 GB RAM).
  # Stack: postgres (real schema via the app's migrations) + adobe/s3mock
  # (S3 stand-in for Hippius) + the locally built API with MAILER=console.
  # The console mailer appends login codes to a mailbox file the test reads.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reader/api build
      - run: pnpm --filter @reader/web build
      - run: pnpm --filter @reader/e2e exec playwright install --with-deps chromium

      - name: Bring up postgres + s3mock
        run: docker compose -f e2e/docker-compose.e2e.yml up -d --wait

      - name: Wait for S3
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000 >/dev/null && exit 0
            sleep 1
          done
          echo "s3mock did not become ready" >&2; exit 1

      - name: Run migrations
        run: cd apps/api && node dist/db/migrate.js
        env:
          POSTGRES_URL: postgres://reader:***@127.0.0.1:5432/reader

      - name: Start API (console mailer)
        run: |
          nohup env \
            APP_MASTER_KEY="$(node -e "process.stdout.write(Buffer.alloc(32,1).toString('base64'))")" \
            HIPPUS_ENDPOINT=http://127.0.0.1:9000 \
            HIPPUS_REGION=us-east-1 \
            HIPPUS_BUCKET=reader-e2e \
            HIPPUS_ACCESS_KEY=minioadmin \
            HIPPUS_SECRET_KEY=*** \
            POSTGRES_URL=postgres://reader:***@127.0.0.1:5432/reader \
            ALLOWED_EMAIL=e2e@reader.test \
            RDR_HOSTNAME=127.0.0.1:3100 \
            RDR_ENV=ci \
            MAILER=console \
            CONSOLE_MAILBOX=/tmp/e2e-mailbox.log \
            PORT=3100 \
            RDR_WEB_DIST=$PWD/apps/web/dist \
            node apps/api/dist/server.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100/v1/health >/dev/null && exit 0
            sleep 1
          done
          echo "api did not become ready" >&2; tail -50 /tmp/api.log >&2; exit 1

      - name: Run Playwright
        run: pnpm --filter @reader/e2e test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
          E2E_MAILBOX: /tmp/e2e-mailbox.log

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- api.log ---"; tail -80 /tmp/api.log || true
          echo "--- mailbox ---"; cat /tmp/e2e-mailbox.log || true
          docker compose -f e2e/docker-compose.e2e.yml logs || true

      - name: Tear down
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down --volumes --remove-orphans

  # Build + push images to GHCR on green.
  images:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reader/api build
      - run: pnpm --filter @reader/web build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/chironreawakened/custom-reader-api:${{ github.sha }}
      # Static web build, extracted to /srv/reader/web-dist by deploy.sh.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/chironreawakened/custom-reader-web:${{ github.sha }}
